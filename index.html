<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sansiri PL1.1 Team 3</title>
    <style>
        /* Apple-style typography and reset */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #86868b;
            margin-bottom: 40px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 17px;
            text-decoration: none;
            border-radius: 980px;
            transition: all 0.3s ease;
            font-weight: 400;
        }

        /* Active Buttons */
        .btn-active {
            background-color: #0071e3;
            color: white;
        }
        .btn-active:hover {
            background-color: #0077ed;
            transform: scale(1.02);
        }

        /* Coming Soon Buttons */
        .btn-inactive {
            background-color: #f5f5f7;
            color: #86868b;
            cursor: default;
        }

        @media (max-width: 600px) {
            h1 { font-size: 40px; }
            .button-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sansiri PL1.1 Team 3</h1>
        <p class="subtitle">Construction Management</p>

        <div class="button-grid">
            <!-- Link 1 -->
            <a href="https://script.google.com/macros/s/AKfycbxnDanBaJ30nz0t2UH0qKcTKIFe31WrFPhhTc78-oDM2vfDVfgt7pPrKN0-6wdT4C2LIQ/exec" class="btn btn-active" target="_blank">1200 ANB</a>
            
            <!-- Link 2 -->
            <a href="https://script.google.com/macros/s/AKfycbxapnIjr4ec44VdcRWcSNwOxQMhMhgpfNmPruLZ1kshsEf7F564VHBmruTr-2femG8oJw/exec" class="btn btn-active" target="_blank">1419 MB26</a>
            
            <!-- Link 3 (Coming Soon) -->
            <div class="btn btn-inactive">Upcoming 3</div>
            
            <!-- Link 4 (Coming Soon) -->
            <div class="btn btn-inactive">Upcoming 4</div>
        </div>
    </div>

</body>
</html>
