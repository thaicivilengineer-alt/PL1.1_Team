<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sansiri PL1.1 Team 3</title>
    <style>
        /* Apple-style typography and reset */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fbfbfd; /* ปรับพื้นหลังให้อ่อนลงเล็กน้อย สไตล์ Apple พรีเมียม */
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
            padding-top: 60px;
            padding-bottom: 60px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
            color: #1d1d1f;
        }

        .subtitle {
            font-size: 19px;
            font-weight: 400;
            color: #86868b;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
            margin-top: 30px;
            margin-bottom: 16px;
            text-align: left;
            border-bottom: 1px solid #d2d2d7;
            padding-bottom: 8px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 16px 20px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 14px; /* ปรับโค้งให้ดูทันสมัยขึ้น */
            transition: all 0.25s ease;
            font-weight: 500;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        /* Active Buttons (สีน้ำเงินพรีเมียม สไตล์ Apple Link/Button) */
        .btn-active {
            background-color: #0071e3; 
            color: white;
        }
        .btn-active:hover {
            background-color: #0077ed;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
            transform: translateY(-2px);
        }

        /* Coming Soon Buttons */
        .btn-inactive {
            background-color: #e5e5ea;
            color: #86868b;
            cursor: default;
            box-shadow: none;
        }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            .button-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sansiri PL Team</h1>
        <p class="subtitle">Management Portal</p>

        <!-- Construction Section -->
        <div class="section-title">Construction Management</div>
        <div class="button-grid">
            <!-- Link 1 -->
            <a href="https://script.google.com/macros/s/AKfycbzjBU8iFs6TeOa4ehZnjEkAFzmOihCfkcP5SEnUlQiukW_6ufhJUQcZ47xQMTQ50V_dJg/exec" class="btn btn-active" target="_blank">1200 Anasiri Bangna</a>
            
            <!-- Link 2 -->
            <a href="https://script.google.com/macros/s/AKfycbyNbyrPsydeiuE9cNJApbvLHXILIM2sOgpgPWFpUYpTH5QXyE9pk94P6ScH4ymPslyN/exec" class="btn btn-active" target="_blank">1419 Mable Bangna Km.26</a>
            
            <!-- Link 3 -->
            <a href="https://script.google.com/macros/s/AKfycbxDFzi-orpLQGsklEtYm8FXcVRYsuAmpwEpVQTWeeIVeb_iuFTIDcDcACZves8BceKzvg/exec" class="btn btn-active" target="_blank">1361 Siri Avenue Bangna 4</a>
            
            <!-- Link 4 (Coming Soon) -->
            <div class="btn btn-inactive">Upcoming 4</div>
        </div>

        <!-- Simmulation Section -->
    <div class="section-title">Simmulation</div>
    <div class="button-grid">
        <!-- Simulation 1 -->
        <a href="#" class="btn btn-active" target="_blank">Simulation Project 1</a>

        <!-- Simulation 2 -->
        <a href="#" class="btn btn-active" target="_blank">Simulation Project 2</a>

        <!-- Simulation 3 -->
        <a href="#" class="btn btn-active" target="_blank">Simulation Project 3</a>

         <!-- Simulation 4 -->
        <a href="#" class="btn btn-active" target="_blank">Simulation Project 4</a>
    </div>


        

        <!-- Admin Section -->
        <div class="section-title">Admin Management</div>
        <div class="button-grid">
            <!-- OFM Order Link -->
            <a href="#" class="btn btn-active" target="_blank">OFM Order</a>
            
            <!-- Office Supplies Order Link -->
            <a href="#" class="btn btn-active" target="_blank">Office Supplies Order</a>
        </div>
    </div>

</body>
</html>
